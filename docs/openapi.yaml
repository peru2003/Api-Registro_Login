openapi: 3.0.3
info:
  title: API de Registro e Inicio de Sesión
  version: 1.0.0
  description: >-
    Servicios REST para registrar usuarios, autenticar credenciales y consultar
    un perfil protegido con token JWT.
servers:
  - url: http://localhost:3000
    description: Servidor local
tags:
  - name: Estado
    description: Disponibilidad de la API
  - name: Autenticación
    description: Registro e inicio de sesión
paths:
  /:
    get:
      tags: [Estado]
      summary: Comprobar el estado de la API
      operationId: comprobarEstado
      responses:
        "200":
          description: La API está disponible.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: API de Registro e Inicio de Sesión funcionando correctamente
                  evidencia:
                    type: string
                    example: GA7-220501096-AA5-EV01
  /api/auth/register:
    post:
      tags: [Autenticación]
      summary: Registrar un usuario
      operationId: registrarUsuario
      description: >-
        Crea una cuenta. El nombre se normaliza quitando espacios al inicio y
        al final; la comparación de nombres no distingue mayúsculas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredencialesRegistro"
            example:
              usuario: abraham
              contraseña: "123456"
      responses:
        "201":
          description: Usuario registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioRegistrado"
        "400":
          description: Cuerpo, usuario o contraseña inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El nombre de usuario ya está registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: El cuerpo de la solicitud supera el tamaño permitido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      operationId: iniciarSesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciales"
            example:
              usuario: abraham
              contraseña: "123456"
      responses:
        "200":
          description: Credenciales válidas; se devuelve un JWT con vigencia de una hora.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
        "400":
          description: Cuerpo o campos requeridos inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Usuario o contraseña incorrectos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: El cuerpo de la solicitud supera el tamaño permitido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/perfil:
    get:
      tags: [Autenticación]
      summary: Consultar el perfil autenticado
      operationId: consultarPerfil
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token válido; acceso autorizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfil"
        "401":
          description: No se envió un token válido o este expiró.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credenciales:
      type: object
      required: [usuario, contraseña]
      properties:
        usuario:
          type: string
          minLength: 1
          example: abraham
        contraseña:
          type: string
          minLength: 1
          writeOnly: true
          description: Máximo 72 bytes UTF-8.
          example: "123456"
    CredencialesRegistro:
      allOf:
        - $ref: "#/components/schemas/Credenciales"
        - type: object
          properties:
            usuario:
              minLength: 3
              maxLength: 30
            contraseña:
              minLength: 6
              description: Máximo 72 bytes UTF-8.
      description: El usuario se compara sin distinguir mayúsculas y se recortan sus espacios externos.
    UsuarioRegistrado:
      type: object
      required: [mensaje, usuario]
      properties:
        mensaje:
          type: string
          example: Usuario registrado correctamente.
        usuario:
          type: string
          example: abraham
    Sesion:
      type: object
      required: [mensaje, usuario, token]
      properties:
        mensaje:
          type: string
          example: Autenticación satisfactoria.
        usuario:
          type: string
          example: abraham
        token:
          type: string
          description: JWT firmado, con vigencia de una hora.
    Perfil:
      type: object
      required: [mensaje, usuario]
      properties:
        mensaje:
          type: string
          example: Acceso autorizado.
        usuario:
          type: string
          example: abraham
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: El usuario y la contraseña son obligatorios y deben ser texto.
